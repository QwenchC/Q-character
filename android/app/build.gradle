plugins { id 'com.android.application' }
android {
    namespace 'com.lumi.qcharacter.android'
    compileSdk 36
    defaultConfig { applicationId 'com.lumi.qcharacter.android'; minSdk 26; targetSdk 36; versionCode 1; versionName '0.1.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { buildConfig true }
    if (System.getenv('QCHAR_ANDROID_KEYSTORE')) {
        signingConfigs { release { storeFile file(System.getenv('QCHAR_ANDROID_KEYSTORE')); storePassword System.getenv('QCHAR_ANDROID_STORE_PASSWORD'); keyAlias 'qcharacter'; keyPassword System.getenv('QCHAR_ANDROID_KEY_PASSWORD') } }
        buildTypes { release { signingConfig signingConfigs.release } }
    }
}
dependencies { implementation 'androidx.webkit:webkit:1.14.0'; implementation 'androidx.exifinterface:exifinterface:1.4.1' }
